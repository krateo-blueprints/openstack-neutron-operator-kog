# Example Composition for the OpenStack Neutron KOG.
#
# Applying this manifest installs the KOG OPERATOR layer: the auth-bridge proxy
# plus the per-resource RestDefinitions (and their CRDs). It does NOT create any
# Neutron object itself.
#
# The Kind/apiVersion are generated by crdgen from the CompositionDefinition:
#   group   = composition.krateo.io
#   version = chart version 0.1.0 -> v0-1-0
#   Kind    = PascalCase of the CD metadata.name (hyphens removed)
#             openstack-neutron-operator-kog -> OpenstackNeutronOperatorKog
#
# Prerequisite: a Secret with the admin clouds.yaml in this namespace, e.g.
#   kubectl create secret generic neutron-clouds \
#     --from-file=clouds.yaml=clouds.yaml -n krateo-system
#
# Once installed, create the actual Neutron resources (NeutronNetwork /
# NeutronSubnet / NeutronSecurityGroup / ...) as shown in
# chart/samples/network-resources.yaml.
apiVersion: composition.krateo.io/v0-1-0
kind: OpenstackNeutronOperatorKog
metadata:
  name: openstack-neutron-operator-kog
  namespace: krateo-system
spec:
  authBridge:
    enabled: true
    # The admin clouds.yaml Secret (the key install-time input).
    cloudsSecret: neutron-clouds
    osCloud: openstack
    # Auto-discover the Neutron endpoint from the Keystone catalog, OR pin it:
    upstreamEndpoint: http://neutron-server.openstack.svc.cluster.local:9696
  restdefinitions:
    network:
      enabled: true
    subnet:
      enabled: true
    # Toggle off the resources you do not need; here we skip floating IPs.
    floatingip:
      enabled: false
