name: lint

# Lints and renders every chart on pull requests, and validates that each chart's values.yaml
# satisfies its values.schema.json. Shape-agnostic: charts are discovered by locating each
# Chart.yaml (skipping vendored subcharts under charts/), so it works for any repo layout.
on:
  pull_request:
    paths:
      - "**"
  workflow_dispatch:

jobs:
  # krateo-blueprints/charts PUBLISHING.md rule 9: every reusable workflow this repository calls is pinned by
  # commit SHA with a version comment. The shared check refuses any that is not.
  pinned-uses:
    permissions:
      contents: read
    uses: krateo-blueprints/charts/.github/workflows/pinned-uses.yaml@aea92de356085f50ea45477a4e6ae2b026cd6b14 # 1.4.2

  lint-docs:
    uses: krateo-platformops/.github/.github/workflows/lint-docs.yaml@e1d3e99215e80ae56eca4a67e9e061b2c73168b8 # 1.0.0

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Stamp the CHART_VERSION placeholder for CI
        run: |
          find . -type f -name Chart.yaml -not -path '*/charts/*' -not -path './.git/*' \
            -exec sed -i "s/CHART_VERSION/0.0.0-ci/g" {} +

      # Gating. release-tag attaches the stamped CompositionDefinition to a release that release-notes
      # may create concurrently; the publisher must treat "already exists" as success and still fail on
      # anything else. Runs against a stand-in gh, no network.
      - name: Release asset publisher survives the release-notes race (hack/test-publish-release-assets.sh)
        run: bash hack/test-publish-release-assets.sh

      - name: helm template + lint every chart (informational)
        run: |
          set -uo pipefail
          # Informational only: charts across repos legitimately require values or private
          # dependencies to render, so render/lint issues are surfaced as warnings, never failing
          # the build. The lint-docs job above is the authoritative gate.
          while IFS= read -r -d '' cf; do
            dir=$(dirname "$cf")
            echo "::group::${dir}"
            helm dependency update "$dir" 2>/dev/null || true
            helm template release "$dir" >/dev/null \
              || echo "::warning::helm template failed for ${dir} (may require values or private deps)"
            helm lint "$dir" || true
            echo "::endgroup::"
          done < <(find . -type f -name Chart.yaml -not -path '*/charts/*' -not -path './.git/*' -print0)

  # Unlike the informational helm job above, this one FAILS the build. Every identifier and
  # additionalStatusField of every RestDefinition must be present in the response schema its
  # observe verb reads; rest-dynamic-controller silently skips one that is not, so the status
  # column stays empty forever. See hack/validate-status-fields.py.
  status-fields:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python3 -m pip install "pyyaml==6.0.2"

      - name: Stamp the CHART_VERSION placeholder for CI
        run: sed -i "s/CHART_VERSION/0.0.0-ci/g" chart/Chart.yaml

      - name: Every status field resolves in its observe response
        run: python3 hack/validate-status-fields.py chart

      # A findby whose identifiers are not keys of the list item can never match: absence is inferred
      # every reconcile and create re-fires forever. Also refuses a findby item that declares no
      # properties. Self-tests its detector first. (Origin: keystone-kog IdentityRoleAssignment, dp303.)
      - name: findby identifiers are keys of the list item
        run: python3 hack/validate-findby-identifiers.py chart
